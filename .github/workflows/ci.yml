name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships /bin/bash 3.2; that is the kernel's floor (build plan K2).
          - name: macOS, /bin/bash 3.2
            os: macos-latest
            bash_path: /bin
          - name: Linux, bash 5
            os: ubuntu-latest
            bash_path: /usr/bin
    steps:
      # Check out into a path containing a space: v1 had test and script bugs
      # that only a path like this exposes (ledger T2).
      - uses: actions/checkout@v4
        with:
          path: src dir

      - name: Install test tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core shellcheck jq parallel
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq bats shellcheck jq parallel
          fi

      - name: Run the suite with the target bash first on PATH
        working-directory: src dir
        env:
          # The hook latency budget (8 ms of VBW's own cost) is calibrated on a
          # developer machine. Hosted runners are 2-3x slower, so CI uses a looser
          # tripwire that still catches the regressions the budget exists for (an
          # added subprocess, work that grows with the input).
          VBW_HOOK_BUDGET_MS: "25"
        run: |
          export PATH="${{ matrix.bash_path }}:$PATH"
          bash --version | head -1
          bash tools/test.sh

  validate:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin and marketplaces
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./plugin
          claude plugin validate .
          node --check plugin/workflows/*.js 2>/dev/null || [ -z "$(ls plugin/workflows/*.js 2>/dev/null)" ]
